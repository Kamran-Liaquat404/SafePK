<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafePK AI Assistant</title>

    <meta name="description" content="SafePK AI Assistant for cybersecurity awareness and scam protection in Pakistan.">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/ai.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<!-- ================= HEADER (SAME AS INDEX) ================= -->
<header>
  <div class="container navbar-container">

    <a href="../index.html" class="logo-block">
      <img src="../assets/images/safepk_cyber_logo_1782237163960.jpg" class="logo-img" />
      <span>Safe<span style="color: var(--color-primary)">PK</span></span>
    </a>

    <nav class="nav-links">
      <a href="../index.html" class="nav-link">Home</a>
      <a href="learn.html" class="nav-link">Learn</a>
      <a href="tools.html" class="nav-link">Tools</a>
    </nav>

  </div>
</header>

<!-- ================= CHAT AREA ================= -->
<main class="chat-container">

    <section class="chat-box">

        <!-- Welcome -->
        <div id="welcome" class="welcome">

            <h1>How can I help you today?</h1>
            <p>Ask about scams, frauds, WhatsApp hacking, banking safety & cyber threats.</p>

        <!-- Messages -->
        <div id="messages" class="messages"></div>

        <!-- Typing -->
        <div id="typing" class="typing">
            <span></span><span></span><span></span>
        </div>

    </section>

</main>

<!-- ================= INPUT ================= -->
<footer class="input-area">

    <div class="input-box">

        <textarea id="input" placeholder="Message SafePK AI..."></textarea>

        <button id="send">
            <i data-lucide="send"></i>
        </button>

    </div>

    <small class="hint">
        SafePK AI may provide incorrect information. Always verify critical security steps.
    </small>

</footer>

<!-- ================= SCRIPT ================= -->
<script src="../js/ai.js"></script>

<script>
    lucide.createIcons();

    const input = document.getElementById("input");

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            document.getElementById("send").click();
        }
    });

    input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = input.scrollHeight + "px";
    });
</script>

</body>
</html>
