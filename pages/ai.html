<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SafePK AI Assistant</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/ai.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<!-- ================= HEADER ================= -->
<header>
  <div class="container navbar-container">

    <a href="../index.html" class="logo-block">
      <img src="../assets/images/safepk_cyber_logo_1782237163960.jpg" class="logo-img" />
      <span>Safe<span style="color: var(--color-primary)">PK</span></span>
    </a>

    <nav class="nav-links">
      <a href="../index.html" class="nav-link">Home</a>
      <a href="learn.html" class="nav-link">Learn</a>
      <a href="tools.html" class="nav-link">Tools</a>
      <a href="directory.html" class="nav-link">Directory</a>
      <a href="ai.html" class="nav-link active">AI</a>
    </nav>

  </div>
</header>

<!-- ================= CHAT WRAPPER ================= -->
<main class="chat-container">

  <section class="chat-box">

    <!-- WELCOME -->
    <div id="welcome" class="welcome">
      <h1>How can I help you today?</h1>
      <p>Ask about scams, frauds, WhatsApp hacking, banking safety & cyber threats.</p>
    </div>

    <!-- MESSAGES (FIXED ID) -->
    <div id="chat-messages" class="messages"></div>

    <!-- TYPING -->
    <div id="typing-indicator" class="typing" style="display:none;">
      <span></span><span></span><span></span>
    </div>

  </section>

</main>

<!-- ================= INPUT ================= -->
<footer class="input-area">

  <div class="input-box">

    <textarea id="user-input" placeholder="Message SafePK AI..."></textarea>

    <button id="send-btn">
      <i data-lucide="send"></i>
    </button>

  </div>

  <small class="hint">
    SafePK AI is for cybersecurity awareness only.
  </small>

</footer>

<!-- ================= SCRIPT ================= -->
<script src="../js/ai.js"></script>

<script>
  lucide.createIcons();

  const input = document.getElementById("user-input");

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      document.getElementById("send-btn").click();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });
</script>

</body>
</html>
